name: Build Android Native APK

on:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: android-native
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 构建 debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tail -60

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AIChatStudio-native-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
